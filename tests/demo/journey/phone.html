<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>remi at Women in Business</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            align-items: center;
            background: radial-gradient(circle at 30% 25%, #6b5847, #2b231c 75%);
            display: flex;
            font-family: system-ui, sans-serif;
            gap: 180px;
            justify-content: center;
        }

        .card {
            border-radius: 6px;
            box-shadow: 0 34px 70px rgb(0 0 0 / 50%);
            height: 900px;
        }

        .phone {
            background: #0c0c0f;
            border-radius: 64px;
            box-shadow: 0 34px 70px rgb(0 0 0 / 50%), inset 0 0 0 2px #3b3b42;
            padding: 14px;
        }

        .screen {
            background: #000;
            border-radius: 50px;
            height: 844px;
            overflow: hidden;
            position: relative;
            width: 390px;
        }

        .camera {
            background: #4a3b2f;
            height: 100%;
            position: relative;
        }

        .photo {
            box-shadow: 0 18px 40px rgb(0 0 0 / 55%);
            left: -378px;
            position: absolute;
            top: -561px;
            width: 801px;
        }

        .viewfinder {
            border: 4px solid #ffd60a;
            border-radius: 18px;
            height: 270px;
            left: 60px;
            position: absolute;
            top: 225px;
            width: 270px;
        }

        .link {
            background: rgb(255 255 255 / 92%);
            border: 0;
            border-radius: 999px;
            box-shadow: 0 8px 24px rgb(0 0 0 / 35%);
            color: #111;
            cursor: pointer;
            font: 600 17px system-ui, sans-serif;
            left: 50%;
            padding: 14px 24px;
            position: absolute;
            top: 540px;
            transform: translateX(-50%);
            white-space: nowrap;
        }

        .browser {
            border: 0;
            display: block;
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>
    <img class="card" src="card.png" alt="The Women in Business table card with the remi QR code">

    <div class="phone">
        <div class="screen">
            <div class="camera" id="camera">
                <img class="photo" src="card.png" alt="">
                <div class="viewfinder"></div>
                <button class="link" id="open" type="button">Open remirememberthat.com</button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('open').addEventListener('click', () => {
            const browser = document.createElement('iframe');

            browser.className = 'browser';
            browser.id = 'browser';
            browser.src = '/wib/?utm_source=qr';
            browser.title = 'The phone browser';
            document.getElementById('camera').replaceWith(browser);
        });
    </script>
</body>
</html>
