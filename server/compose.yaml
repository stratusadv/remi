name: remi

services:
    postgres:
        image: postgres:17-alpine
        environment:
            POSTGRES_DB: remi
            POSTGRES_PASSWORD: remi
            POSTGRES_USER: remi
        healthcheck:
            test:
                - CMD
                - pg_isready
                - --dbname=remi
                - --host=127.0.0.1
                - --username=remi
            interval: 1s
            retries: 60
        ports:
            - 127.0.0.1:55432:5432
        volumes:
            - postgres:/var/lib/postgresql/data

volumes:
    postgres:
