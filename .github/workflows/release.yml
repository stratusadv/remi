name: release

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      args: --target universal-apple-darwin
                      targets: aarch64-apple-darwin,x86_64-apple-darwin
                    - os: ubuntu-24.04
                      args: ""
                      targets: ""
                    - os: windows-latest
                      args: ""
                      targets: ""
        runs-on: ${{ matrix.os }}
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7

            - uses: oven-sh/setup-bun@v2

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.targets }}

            - name: Install packages
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      gstreamer1.0-pipewire \
                      gstreamer1.0-plugins-base \
                      gstreamer1.0-plugins-good \
                      gstreamer1.0-pulseaudio \
                      librsvg2-dev \
                      libwebkit2gtk-4.1-dev \
                      patchelf \
                      xdg-utils

            - name: Install
              run: bun install --frozen-lockfile

            - uses: tauri-apps/tauri-action@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REMI_ACCOUNT_HOST: ${{ vars.REMI_ACCOUNT_HOST }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              with:
                  args: ${{ matrix.args }}
                  tagName: ${{ github.event_name == 'push' && 'v__VERSION__' || '' }}
                  releaseName: ${{ github.event_name == 'push' && 'v__VERSION__' || '' }}
                  uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
                  releaseBody: See the assets below to download this version.
                  releaseDraft: false
                  prerelease: true
                  updaterJsonPreferNsis: true

    updater:
        needs: build
        if: github.event_name == 'push'
        runs-on: ubuntu-24.04
        permissions:
            contents: write
        env:
            GH_REPO: ${{ github.repository }}
            GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - name: Point the updater at release download links
              shell: bash
              run: |
                  api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/assets/"
                  base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"

                  gh release download "$GITHUB_REF_NAME" --pattern latest.json --output latest-api.json
                  gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                      | jq '.assets | map({key: (.id | tostring), value: .name}) | from_entries' \
                      > names.json

                  jq \
                      --arg api "$api" \
                      --arg base "$base" \
                      --slurpfile names names.json \
                      '.platforms |= map_values(.url |= (if startswith($api) then $base + (($names[0][ltrimstr($api)] // error("no release asset has the id in " + .)) | @uri) else . end))' \
                      latest-api.json > latest.json

                  jq --exit-status --arg base "$base" 'all(.platforms[]; .url | startswith($base))' latest.json

                  for url in $(jq --raw-output '.platforms[].url' latest.json | sort --unique); do
                      status=$(curl --head --silent --output /dev/null --write-out '%{http_code}' "$url")

                      if [ "$status" != 302 ]; then
                          echo "$url answered $status, not a redirect to its file"
                          exit 1
                      fi
                  done

                  gh release upload "$GITHUB_REF_NAME" latest.json --clobber

            - name: Mark the release latest
              shell: bash
              run: |
                  gh release edit "$GITHUB_REF_NAME" --prerelease=false
                  gh release edit "$GITHUB_REF_NAME" --latest
