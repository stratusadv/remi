[project]
site_name = "remi"
site_description = "A desktop app that transforms meetings into notes."
site_url = "https://remirememberthat.com/"
repo_name = "stratusadv/remi"
repo_url = "https://github.com/stratusadv/remi"
copyright = "Copyright (c) 2026 Stratus Advanced Technologies"
dev_addr = "localhost:8007"
extra_css = ["assets/stylesheets/brand.css"]
nav = [
    { "Overview" = "overview.md" },
    { "Install" = "install.md" },
    { "Setup" = "setup.md" },
    { "Recording" = "recording.md" },
    { "Notes" = "notes.md" },
    { "Templates" = "templates.md" },
    { "Exporting" = "exporting.md" },
    { "Troubleshooting" = "troubleshooting.md" },
]

[project.theme]
custom_dir = "overrides"
favicon = "assets/remi-icon-32.png"
features = [
    "content.code.copy",
    "content.tabs.link",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
]
font = false
language = "en"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
